<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>她的周期</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="她的周期">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f2f6">
<style>
/* 布局：原生 App 式单列，顶部问候 + 酒红渐变主卡，底部毛玻璃标签栏，记录用底部抽屉 */
:root{
  --bg:#f6f2f6; --surface:#ffffff; --surface2:#faf6fa; --ink:#2a1b2b; --mute:#8d7f8f; --line:#ece3ec;
  --wine:#9e1f48; --rose:#e2718f; --rose-soft:#fbe3ea; --lav:#9c87d8; --lav-soft:#ece6fa;
  --teal:#2f9e92; --teal-soft:#d8f1ed; --amber:#d79a3d; --amber-soft:#f9ecd6;
  --hero1:#3a1430; --hero2:#7d1d45; --hero3:#b8475f;
  --navbg:rgba(255,255,255,.82);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#130d13; --surface:#1e161e; --surface2:#251c25; --ink:#f4eaf2; --mute:#a3929f; --line:#33263a;
  --wine:#f27a9b; --rose:#f08aa6; --rose-soft:#43202d; --lav:#b9a6f0; --lav-soft:#2c2540;
  --teal:#66cfc2; --teal-soft:#183532; --amber:#ecb66a; --amber-soft:#3a2c17;
  --hero1:#2a0f23; --hero2:#5e1636; --hero3:#8f3550; --navbg:rgba(30,22,30,.85); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.view{display:flex;flex-direction:column;gap:14px;animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view,.sheet .panel{animation:none!important}}

/* 顶部 */
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 2px 2px}
.hello{font:600 24px/1.2 var(--serif);letter-spacing:.02em}
.date{color:var(--mute);font-size:13px;margin-top:2px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--lav));display:grid;place-items:center;color:#fff;font:600 16px var(--serif);border:0}
h2{font:600 18px/1.3 var(--serif);margin:6px 2px 0;letter-spacing:.02em}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(80,20,50,.18)}
.muted{color:var(--mute)}
.tiny{font-size:12px;color:var(--mute);letter-spacing:.04em}

/* 主卡 */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 18px 18px;color:#fff;
  background:radial-gradient(120% 90% at 85% 0%,var(--hero3) 0%,transparent 60%),linear-gradient(165deg,var(--hero1),var(--hero2));
  box-shadow:0 18px 40px -22px rgba(120,20,60,.7)}
.hero::after{content:"";position:absolute;width:260px;height:260px;right:-90px;bottom:-120px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,190,.25),transparent)}
.ringwrap{position:relative;width:min(250px,72vw);aspect-ratio:1;margin:0 auto}
.ringwrap svg{width:100%;height:100%;display:block}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc .lbl{font-size:13px;opacity:.8;letter-spacing:.06em}
.ringc .num{font:600 64px/1 var(--serif);font-variant-numeric:tabular-nums;margin:4px 0}
.ringc .sub{font-size:13px;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:13px;backdrop-filter:blur(6px)}
.pill i{width:8px;height:8px;border-radius:50%}
.heroBtns{display:flex;gap:10px;justify-content:center;margin-top:14px;position:relative;z-index:1}
.hbtn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px}
.hbtn.main{background:#fff;color:var(--hero2)}
.hbtn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}

/* 周条 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk{border:0;background:none;padding:6px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wk .w{font-size:11px;color:var(--mute)}
.wk .d{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.wk.today{background:var(--surface2)}
.wk.today .w{color:var(--ink);font-weight:600}

/* 日期颜色 */
.c-period{background:var(--wine);color:#fff;font-weight:600}
.c-predict{box-shadow:inset 0 0 0 1.5px var(--rose);color:var(--rose)}
.c-fertile{background:var(--teal-soft)}
.c-ovu{background:var(--teal);color:#fff;font-weight:600}

/* 三格信息 */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--surface);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 0 var(--line)}
.mini b{font:600 17px/1.3 var(--serif);font-variant-numeric:tabular-nums}
.mini .dot{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;margin-bottom:4px}

/* 阶段卡 */
.phasehead{display:flex;align-items:center;gap:10px}
.phaseicon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.phasehead h3{margin:0;font:600 17px var(--serif)}
.tips{display:grid;gap:10px;margin-top:12px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:14px;padding:10px 12px}
.tip .k{flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:1px}
.tip p{margin:0;font-size:14px;min-width:0}

/* 今日记录摘要 */
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{border:0;background:none;color:var(--wine);font-weight:600;font-size:14px;padding:4px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.empty{color:var(--mute);font-size:14px;margin-top:8px}

/* 喝水 */
.cups{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cup{width:30px;height:36px;border:0;padding:0;background:none}
.cup svg{width:100%;height:100%}

/* 日历 */
.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead strong{font:600 18px var(--serif)}
.navb{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.gw{font-size:12px;color:var(--mute);padding:4px 0}
.gd{position:relative;aspect-ratio:1;border:0;border-radius:50%;background:none;font-size:15px;font-variant-numeric:tabular-nums;max-width:100%}
.gd.out{visibility:hidden}
.gd.today::after{content:"今";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:9px;color:var(--wine)}
.gd.c-period.today::after,.gd.c-ovu.today::after{color:#fff}
.gd.sel{outline:2px solid var(--ink);outline-offset:1px}
.gd .ld{position:absolute;top:4px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--lav)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%}

/* 分析 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:18px;padding:14px 12px;box-shadow:0 1px 0 var(--line)}
.kpi b{display:block;font:600 26px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.kpi .u{font-size:12px;color:var(--mute)}
.hist{display:grid;gap:10px;margin-top:12px}
.hrow{display:grid;grid-template-columns:64px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.hbar{height:12px;border-radius:999px;background:var(--surface2);position:relative;overflow:hidden}
.hbar .p{position:absolute;left:0;top:0;bottom:0;background:var(--wine);border-radius:999px}
.hbar .f{position:absolute;top:0;bottom:0;background:var(--teal-soft)}
.hbar .t{position:absolute;left:0;top:0;bottom:0;background:var(--rose-soft);border-radius:999px}
.freq{display:grid;gap:8px;margin-top:12px}
.frow{display:grid;grid-template-columns:56px 1fr 30px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.fbar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:999px}
.spark{width:100%;height:80px;display:block;margin-top:8px}

/* 我的 */
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li input[type=number],.li input[type=text]{width:90px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:15px var(--sans);text-align:center}
.li input[type=text]{width:120px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface2);color:var(--ink);font:14px var(--sans);resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.b{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:14px}
.b.pri{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:600}
.b.danger{color:#c0392b}
.note{font-size:12px;color:var(--mute);line-height:1.7;margin:0 4px}

/* 底部导航 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navbg);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--wine);font-weight:600}
.plus{justify-self:center;width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--rose),var(--wine));color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--wine);margin-top:-18px}
.plus svg{width:26px;height:26px}

/* 抽屉 */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(25,8,20,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1);
  padding:8px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-8px;background:var(--bg);padding:6px 0 10px;z-index:2}
.shead strong{font:600 19px var(--serif)}
.grp{background:var(--surface);border-radius:18px;padding:14px;margin-bottom:10px}
.grp .gt{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:10px}
.grp .gt i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px}
.chip.on{border-color:transparent;color:#fff}
.g-period .chip.on{background:var(--wine)}
.g-body .chip.on{background:var(--lav)}
.g-mood .chip.on{background:var(--amber)}
.g-dis .chip.on{background:var(--teal)}
.g-love .chip.on{background:var(--rose)}
.g-life .chip.on{background:var(--ink);color:var(--bg)}
.bigtoggle{width:100%;border:0;border-radius:16px;padding:14px;font-weight:600;font-size:16px;background:var(--rose-soft);color:var(--wine);margin-bottom:10px}
.bigtoggle.on{background:var(--wine);color:#fff}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.nums input{width:100%;padding:9px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:15px var(--sans);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;z-index:40;white-space:nowrap}
.banner{display:flex;gap:10px;align-items:center;background:var(--rose-soft);color:var(--ink);border-radius:18px;padding:12px 14px;font-size:14px}
.banner b{color:var(--wine)}
.gd.c-period{background:var(--wine);color:#fff}.gd.c-fertile{background:var(--teal-soft)}.gd.c-ovu{background:var(--teal);color:#fff}
.top{margin-bottom:14px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="hello" id="hello"></div><div class="date" id="today"></div></div>
    <button class="avatar" id="avatar" type="button" aria-label="我的"></button>
  </div>
  <main id="main"></main>
</div>

<nav class="nav"><div class="in">
  <button class="tab" data-t="home" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8" stroke-width="3" stroke-linecap="round"/></svg>今天</button>
  <button class="tab" data-t="cal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>日历</button>
  <button class="plus" id="plus" type="button" aria-label="记录今天"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-t="stats" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>分析</button>
  <button class="tab" data-t="me" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="9" r="4"/><path d="M4.5 20c1.5-3.5 4.3-5 7.5-5s6 1.5 7.5 5"/></svg>我的</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const KEY='her-cycle-v1';
const DEF={v:2,name:'宝贝',period:[],logs:{},cycleLen:28,periodLen:5,remind:3};
let S=Object.assign({},DEF);
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign({},DEF,JSON.parse(raw));}catch(e){}
// 兼容旧版记录
for(const k in S.logs){const L=S.logs[k]; if(typeof L.mood==='string') L.mood=L.mood?[L.mood]:[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('这台设备不允许保存');}}

/* —— 日期 —— */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c);};
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const diff=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const today=new Date(); today.setHours(0,0,0,0);
const TK=key(today);
const WD='日一二三四五六';
const fmt=d=>(d.getMonth()+1)+'月'+d.getDate()+'日';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* —— 记录分类 —— */
const CATS={
  flow:{t:'流量',list:['点滴','少','中','多','很多'],multi:false,g:'period'},
  color:{t:'颜色',list:['鲜红','暗红','褐色','粉色'],multi:false,g:'period'},
  pain:{t:'痛经程度',list:['不痛','轻微','中等','明显','剧烈'],multi:false,g:'period'},
  sym:{t:'身体症状',list:['腹痛','腰酸','头痛','胸胀','腹胀','长痘','疲倦','失眠','恶心','腹泻','便秘','头晕','怕冷','水肿','食欲大','皮肤油'],multi:true,g:'body'},
  mood:{t:'心情',list:['开心','平静','有活力','恋爱脑','烦躁','焦虑','低落','敏感','想哭','没耐心'],multi:true,g:'mood'},
  dis:{t:'分泌物',list:['没有','偏干','黏稠','乳白','蛋清状','水样','异常'],multi:false,g:'dis'},
  love:{t:'亲密',list:['没有','有保护','无保护'],multi:false,g:'love'},
  exer:{t:'运动',list:['散步','瑜伽','跑步','健身','游泳','跳舞','骑车'],multi:true,g:'life'},
  med:{t:'用药',list:['止痛药','避孕药','维生素','铁剂','中药'],multi:true,g:'life'}
};
const GROUP={period:['经期','var(--wine)','var(--rose-soft)'],body:['身体','var(--lav)','var(--lav-soft)'],mood:['心情','var(--amber)','var(--amber-soft)'],dis:['分泌物','var(--teal)','var(--teal-soft)'],love:['亲密','var(--rose)','var(--rose-soft)'],life:['生活','var(--ink)','var(--surface2)']};

/* —— 周期模型 —— */
function model(){
  const days=[...new Set(S.period)].sort();
  const runs=[];
  for(const k of days){const d=parse(k),last=runs[runs.length-1];
    if(last&&diff(last.end,d)<=2) last.end=d; else runs.push({start:d,end:d});}
  const gaps=[];
  for(let i=1;i<runs.length;i++){const g=diff(runs[i-1].start,runs[i].start); if(g>=18&&g<=60) gaps.push({g,start:runs[i-1].start,plen:diff(runs[i-1].start,runs[i-1].end)+1});}
  const rec=gaps.slice(-6).map(x=>x.g);
  const cyc=rec.length?Math.round(rec.reduce((a,b)=>a+b,0)/rec.length):S.cycleLen;
  const done=runs.filter(r=>diff(r.start,today)>8).slice(-6).map(r=>diff(r.start,r.end)+1);
  const plen=done.length>=2?Math.round(done.reduce((a,b)=>a+b,0)/done.length):S.periodLen;
  const last=runs[runs.length-1]||null;
  const preds=[];
  if(last){let s=add(last.start,cyc); while(diff(s,today)>0) s=add(s,cyc); for(let i=0;i<6;i++) preds.push(add(s,i*cyc));}
  let sd=null; if(rec.length>=2){const m=rec.reduce((a,b)=>a+b,0)/rec.length; sd=Math.sqrt(rec.reduce((a,b)=>a+(b-m)*(b-m),0)/rec.length);}
  return {runs,gaps,cyc,plen,last,preds,sd};
}
function classify(M){
  const map={};
  for(const k of S.period) map[k]='period';
  const fert=start=>{const ov=add(start,-14); for(let i=-5;i<=1;i++){const k=key(add(ov,i)); if(!map[k]) map[k]=i===0?'ovu':'fertile';}};
  if(M.last){
    for(const r of M.runs.slice(-6)){const nx=add(r.start,M.cyc); if(nx<=add(today,M.cyc)) fert(nx);}
    for(const p of M.preds){
      for(let i=0;i<M.plen;i++){const d=add(p,i),k=key(d); if(!map[k]&&d>=today) map[k]='predict';}
      fert(add(p,M.cyc));
    }
  }
  return map;
}

function status(M){
  if(!M.last) return null;
  const day=diff(M.last.start,today)+1;
  const next=M.preds[0]; const toNext=diff(today,next);
  const inP=S.period.includes(TK);
  const ov=add(next,-14); const dOv=diff(today,ov);
  let ph;
  if(inP) ph='period';
  else if(day>M.cyc+5) ph='late';
  else if(dOv===0) ph='ovu';
  else if(dOv>=-1&&dOv<=5) ph='fert';
  else if(dOv>0) ph='foll';
  else ph='lut';
  const chance=ph==='ovu'?'很高':ph==='fert'?'较高':ph==='period'?'很低':'低';
  return {day,next,toNext,ph,ov,chance,inP};
}

function ringSVG(M,st){
  const cyc=M.cyc, plen=M.plen, ovd=cyc-14; // 第几天排卵（从 1 开始算是 ovd）
  const cx=100,cy=100,r=82,gap=1.4;
  const pt=a=>{const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)];};
  let segs='';
  for(let i=0;i<cyc;i++){
    const d=i+1; let col='rgba(255,255,255,.22)';
    if(d<=plen) col='#ff86a3';
    else if(d===ovd) col='#9ff0e4';
    else if(d>=ovd-5&&d<=ovd+1) col='rgba(127,224,211,.6)';
    else if(d>ovd+1) col='rgba(255,207,140,.45)';
    const a0=i/cyc*360+gap/2,a1=(i+1)/cyc*360-gap/2;
    const [x0,y0]=pt(a0),[x1,y1]=pt(a1);
    segs+=`<path d="M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="butt"/>`;
  }
  let mark='';
  if(st){const dd=Math.min(st.day,cyc); const a=(dd-.5)/cyc*360; const [x,y]=pt(a);
    mark=`<circle cx="${x}" cy="${y}" r="13" fill="rgba(255,255,255,.25)"/><circle cx="${x}" cy="${y}" r="8.5" fill="#fff"/>`;}
  return `<svg viewBox="0 0 200 200" aria-hidden="true">${segs}${mark}</svg>`;
}

    <section class="card"><div class="rowhead"><h2 style="margin:0">喝水</h2><span class="tiny">${water} / 8 杯</span></div><div class="cups">${cups}</div></section>

function logTags(L){
  const out=[];
  if(!L) return out;
  if(L.flow) out.push('流量'+L.flow);
  if(L.pain&&L.pain!=='不痛') out.push('痛经'+L.pain);
  for(const f of ['sym','mood','exer','med']) (L[f]||[]).forEach(x=>out.push(x));
  if(L.dis&&L.dis!=='没有') out.push('分泌物'+L.dis);
  if(L.love&&L.love!=='没有') out.push('亲密·'+L.love);
  if(L.temp) out.push(L.temp+'℃');
  if(L.weight) out.push(L.weight+'kg');
  if(L.sleep) out.push('睡 '+L.sleep+' 小时');
  if(L.note) out.push('📝 '+String(L.note).slice(0,12));
  return out;
}

function vStats(M){
  const n=M.runs.length;
  if(n<1) return `<h2>分析</h2><section class="card"><div class="empty">记录满两次月经后，这里会显示她的周期规律、常见症状和心情变化。</div></section>`;
  const reg=M.sd==null?'待观察':M.sd<=2?'很规律':M.sd<=5?'较规律':'不太规律';
  const regc=M.sd==null?'var(--mute)':M.sd<=2?'var(--teal)':M.sd<=5?'var(--amber)':'var(--wine)';
  // 周期历史
  const hs=M.gaps.slice(-6).reverse(); const maxG=Math.max(35,...hs.map(x=>x.g));
  const hist=hs.length?hs.map(x=>{const ov=x.g-14;return `<div class="hrow"><span class="muted">${fmt(x.start)}</span>
    <div class="hbar"><span class="t" style="width:${x.g/maxG*100}%"></span><span class="f" style="left:${(ov-5)/maxG*100}%;width:${7/maxG*100}%"></span><span class="p" style="width:${x.plen/maxG*100}%"></span></div><b>${x.g}天</b></div>`;}).join(''):'<div class="empty">记录满两次月经后显示。</div>';
  // 症状 / 心情统计
  const cnt=f=>{const c={};for(const k in S.logs)(S.logs[k][f]||[]).forEach(x=>c[x]=(c[x]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6);};
  const bars=(arr,col)=>{if(!arr.length) return '<div class="empty">还没有相关记录。</div>'; const m=arr[0][1];
    return arr.map(([k,v])=>`<div class="frow"><span>${esc(k)}</span><div class="fbar"><i style="width:${v/m*100}%;background:${col}"></i></div><span class="muted">${v}次</span></div>`).join('');};
  // 痛经
  const painC={}; for(const k in S.logs){const p=S.logs[k].pain; if(p&&p!=='不痛') painC[p]=(painC[p]||0)+1;}
  // 体温/体重曲线
  const series=f=>Object.keys(S.logs).sort().filter(k=>S.logs[k][f]).slice(-30).map(k=>[k,+S.logs[k][f]]);
  const spark=(arr,col,unit)=>{if(arr.length<2) return `<div class="empty">记两天以上就能看到曲线。</div>`;
    const ys=arr.map(a=>a[1]),mn=Math.min(...ys),mx=Math.max(...ys),rg=(mx-mn)||1,W=300,H=70;
    const pts=arr.map((a,i)=>[(i/(arr.length-1))*(W-20)+10,H-8-((a[1]-mn)/rg)*(H-20)]);
    const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const last=pts[pts.length-1];
    return `<svg class="spark" viewBox="0 0 ${W} ${H+10}" preserveAspectRatio="none"><polyline points="10,${H} ${line} ${W-10},${H}" fill="${col}" opacity=".12" stroke="none"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${col}"/></svg>
      <div class="rowhead tiny"><span>最低 ${mn}${unit}</span><span>最近 ${ys[ys.length-1]}${unit}</span><span>最高 ${mx}${unit}</span></div>`;};
  return `<h2>分析</h2>
    <div class="kpis"><div class="kpi"><span class="u">平均周期</span><b>${M.cyc}</b><span class="u">天</span></div>
      <div class="kpi"><span class="u">平均经期</span><b>${M.plen}</b><span class="u">天</span></div>
      <div class="kpi"><span class="u">规律程度</span><b style="font-size:20px;color:${regc};margin:3px 0 4px">${reg}</b><span class="u">${M.sd==null?'需 3 次记录':'波动 ±'+M.sd.toFixed(1)+' 天'}</span></div></div>
    <section class="card"><div class="rowhead"><h2 style="margin:0">周期历史</h2><span class="tiny">共 ${n} 次</span></div>
      <div class="legend" style="margin-top:6px"><span><i style="background:var(--wine)"></i>经期</span><span><i style="background:var(--teal-soft)"></i>易孕期</span><span><i style="background:var(--rose-soft)"></i>整个周期</span></div>
      <div class="hist">${hist}</div><p class="note" style="margin:10px 0 0">正常周期一般在 21～35 天，经期 3～7 天。</p></section>
    <section class="card"><h2 style="margin:0">常见症状</h2><div class="freq">${bars(cnt('sym'),'var(--lav)')}</div></section>
    <section class="card"><h2 style="margin:0">心情</h2><div class="freq">${bars(cnt('mood'),'var(--amber)')}</div></section>
    <section class="card"><h2 style="margin:0">痛经</h2><div class="freq">${bars(Object.entries(painC).sort((a,b)=>b[1]-a[1]),'var(--wine)')}</div></section>
    <section class="card"><h2 style="margin:0">基础体温</h2>${spark(series('temp'),'var(--rose)','℃')}</section>
    <section class="card"><h2 style="margin:0">体重</h2>${spark(series('weight'),'var(--teal)','kg')}</section>`;
}

      <div class="btns"><button class="b" data-act="mk" type="button">生成备份</button><button class="b" data-act="cp" type="button">复制</button><button class="b pri" data-act="rs" type="button">从上面恢复</button></div></section>
    <section class="card"><div class="btns" style="margin:0"><button class="b danger" data-act="wipe" type="button">清空全部记录</button></div><p class="note" id="wipeMsg" hidden style="margin:8px 0 0">再点一次就会删除全部记录，删除后找不回来。</p></section>
    <p class="note">预测是按她过去的记录推算的，只能参考，不能用来避孕。周期长期不规律、痛经很厉害或出血异常，请去看医生。</p>
    <p class="note" style="text-align:center">她的周期 · 2.0</p>`;
}

/* —— 记录抽屉 —— */
let logDay=TK;
function openLog(k){
  if(parse(k)>today){toast('未来的日子还不能记录');return;}
  logDay=k; drawLog(); document.getElementById('sheet').hidden=false; document.body.style.overflow='hidden';
}
function closeLog(){document.getElementById('sheet').hidden=true; document.body.style.overflow=''; render();}
function drawLog(){
  const d=parse(logDay), L=S.logs[logDay]||{}, isP=S.period.includes(logDay);
  const chips=f=>{const C=CATS[f];return `<div class="chips">${C.list.map(v=>{const on=C.multi?(L[f]||[]).includes(v):L[f]===v;
    return `<button class="chip ${on?'on':''}" data-f="${f}" data-v="${v}" type="button">${v}</button>`;}).join('')}</div>`;};
  const grp=(g,inner)=>{const G=GROUP[g];return `<div class="grp g-${g}"><div class="gt"><i style="background:${G[2]};color:${G[1]}">●</i>${G[0]}</div>${inner}</div>`;};
  const sub=(f)=>`<div class="tiny" style="margin:10px 0 6px">${CATS[f].t}</div>${chips(f)}`;
  document.getElementById('panel').innerHTML=`<div class="grab"></div>
    <div class="shead"><div><div class="tiny">${logDay===TK?'今天':'补记'}</div><strong>${fmt(d)} 周${WD[d.getDay()]}</strong></div><button class="b pri" data-act="close" type="button">完成</button></div>
    <button class="bigtoggle ${isP?'on':''}" data-act="sheetP" type="button">${isP?'✓ 这天是经期（点一下取消）':'这天来月经了'}</button>
    ${isP?grp('period',`<div class="tiny" style="margin-bottom:6px">流量</div>${chips('flow')}${sub('color')}${sub('pain')}`):grp('period',`<div class="tiny" style="margin-bottom:6px">痛经程度</div>${chips('pain')}`)}
    ${grp('body',chips('sym'))}
    ${grp('mood',chips('mood'))}
    ${grp('dis',chips('dis'))}
    ${grp('love',chips('love'))}
    ${grp('life',`<div class="tiny" style="margin-bottom:6px">运动</div>${chips('exer')}${sub('med')}
      <div class="nums" style="margin-top:12px"><label>基础体温 ℃<input type="number" step="0.01" min="35" max="38.5" id="nTemp" value="${L.temp||''}" inputmode="decimal"></label>
      <label>体重 kg<input type="number" step="0.1" min="25" max="200" id="nWeight" value="${L.weight||''}" inputmode="decimal"></label>
      <label>睡眠 小时<input type="number" step="0.5" min="0" max="16" id="nSleep" value="${L.sleep||''}" inputmode="decimal"></label></div>`)}
    <div class="grp"><div class="gt">备注</div><textarea id="nNote" placeholder="今天想记点什么都可以">${esc(L.note)}</textarea></div>`;
}
document.getElementById('panel').addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(c){const f=c.dataset.f,v=c.dataset.v,L=S.logs[logDay]||(S.logs[logDay]={});
    if(CATS[f].multi){L[f]=L[f]||[]; L[f]=L[f].includes(v)?L[f].filter(x=>x!==v):[...L[f],v];}
    else L[f]=L[f]===v?'':v;
    save(); drawLog(); return;}
  const a=e.target.closest('[data-act]'); if(!a) return;
  if(a.dataset.act==='close') closeLog();
  if(a.dataset.act==='sheetP'){togglePeriod(logDay); drawLog();}
});
document.getElementById('panel').addEventListener('input',e=>{
  const m={nTemp:'temp',nWeight:'weight',nSleep:'sleep',nNote:'note'}[e.target.id]; if(!m) return;
  const L=S.logs[logDay]||(S.logs[logDay]={}); L[m]=e.target.value; save();
});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet') closeLog();});

/* —— 经期操作 —— */
function startOn(k){
  const M=model(), d=parse(k);
  for(let i=0;i<M.plen;i++){const x=add(d,i); if(x<=today) S.period.push(key(x));}
  S.period=[...new Set(S.period)]; save(); toast('已记下 '+fmt(d)+' 开始');
}
function togglePeriod(k){
  if(S.period.includes(k)){S.period=S.period.filter(x=>x!==k); save(); return;}
  const d=parse(k), near=S.period.some(x=>Math.abs(diff(parse(x),d))<=2);
  if(near){S.period.push(k); save();} else startOn(k);
}

/* —— 事件 —— */
let wipeArmed=false;
function bind(M){
  main.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='start'){startOn(TK); render();}
    else if(a==='end'){S.period=S.period.filter(k=>parse(k)<=today); save(); toast('好的，经期到今天结束'); render();}
    else if(a==='log') openLog(TK);
    else if(a==='logSel') openLog(calSel);
    else if(a==='toggleP'){togglePeriod(calSel); render();}
    else if(a==='mk'){document.getElementById('bk').value='HERCYCLE:'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))); toast('备份已生成');}
    else if(a==='cp'){const v=document.getElementById('bk').value; if(!v){toast('先点「生成备份」');return;}
      (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('已复制')).catch(()=>{document.getElementById('bk').select();toast('已选中，长按复制');});}
    else if(a==='rs'){try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('bk').value.trim().replace(/^HERCYCLE:/,'')))));
        if(!Array.isArray(o.period)) throw 0; S=Object.assign({},DEF,o); save(); toast('恢复好了'); tab='home'; render();}catch(e){toast('备份文字不完整，再复制一次试试');}}
    else if(a==='wipe'){if(!wipeArmed){wipeArmed=true;document.getElementById('wipeMsg').hidden=false;return;}
      S=Object.assign({},DEF,{name:S.name,cycleLen:S.cycleLen,periodLen:S.periodLen,remind:S.remind}); save(); wipeArmed=false; toast('已清空'); render();}
  });
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go; render();});
  main.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openLog(b.dataset.day));
  main.querySelectorAll('[data-cup]').forEach(b=>b.onclick=()=>{const n=+b.dataset.cup,L=S.logs[TK]||(S.logs[TK]={}); L.water=L.water===n?n-1:n; save(); render();});
  main.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{calView=new Date(calView.getFullYear(),calView.getMonth()+ +b.dataset.mon,1); render();});
  main.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{calSel=b.dataset.pick; render();});
  const f=(id,fn)=>{const el=document.getElementById(id); if(el) el.onchange=()=>{fn(el.value); save(); header(); toast('已保存');};};
  f('fName',v=>S.name=v.trim()||'宝贝');
  f('fCyc',v=>{v=+v; if(v>=18&&v<=60) S.cycleLen=v;});
  f('fPer',v=>{v=+v; if(v>=1&&v<=12) S.periodLen=v;});
  f('fRem',v=>{v=+v; if(v>=0&&v<=7) S.remind=v;});
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t; wipeArmed=false; render(); window.scrollTo(0,0);});
document.getElementById('plus').onclick=()=>openLog(TK);
document.getElementById('avatar').onclick=()=>{tab='me'; render(); window.scrollTo(0,0);};

let tt; function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2000);}

render();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
</html>
